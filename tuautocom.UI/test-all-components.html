<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - Todos los Componentes | TuAutoCom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { 'primary-dark': '#10231c','primary-medium': '#214a3c','primary-light': '#8ecdb7' } } } }
  </script>
</head>
<body class="bg-primary-dark min-h-screen text-white">
  <div id="app"></div>

  <script type="module">
    import { Header } from './js/components/Header.js';
    import { HeroSection } from './js/components/HeroSection.js';
    import { CategoryFilters } from './js/components/CategoryFilters.js';
    import { VehicleCard } from './js/components/VehicleCard.js';
    import { Footer } from './js/components/Footer.js';
    import { SearchBar } from './js/components/SearchBar.js';
    import { ContactForm } from './js/components/ContactForm.js';
    import { VehicleCarousel } from './js/components/VehicleCarousel.js';

    const testCategories = [
      { id: 'all', label: 'Todos' },
      { id: 'sedan', label: 'Sedán' },
      { id: 'suv', label: 'SUV' },
      { id: 'pickup', label: 'Pick-up' },
      { id: 'electric', label: 'Eléctricos' }
    ];

    const testVehicles = [
      { id: 'v1', image: 'https://images.unsplash.com/photo-1555215695-3004980ad54e?w=400&h=300&fit=crop', title: 'Toyota Camry 2024', description: 'Sedán ejecutivo con tecnología híbrida avanzada', badge: { text: 'Popular' } },
      { id: 'v2', image: 'https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?w=400&h=300&fit=crop', title: 'Ford Explorer 2024', description: 'SUV espacioso ideal para familias', badge: { text: 'Nuevo' } },
      { id: 'v3', image: 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=400&h=300&fit=crop', title: 'Tesla Model 3', description: 'Sedán eléctrico con autopilot incluido', badge: { text: 'Eléctrico' } },
      { id: 'v4', image: 'https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=400&h=300&fit=crop', title: 'Honda CR-V 2024', description: 'SUV compacto con excelente economía de combustible' },
      { id: 'v5', image: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400&h=300&fit=crop', title: 'BMW Serie 3', description: 'Lujo y deportividad en perfecta armonía', badge: { text: 'Premium' } },
      { id: 'v6', image: 'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400&h=300&fit=crop', title: 'Chevrolet Silverado', description: 'Pick-up de trabajo pesado con gran capacidad' }
    ];

    function renderApp() {
      const app = document.getElementById('app');

      const header = new Header({ logo: 'TuAutoCom', links: [ { label: 'Inicio', url: '#' }, { label: 'Catálogo', url: '#' }, { label: 'Categorías', url: '#' }, { label: 'Contacto', url: '#' } ] });
      app.appendChild(header.render());

      const hero = new HeroSection({ title: 'Encuentra tu Auto Ideal', subtitle: 'Explora nuestra selección de vehículos nuevos y seminuevos', backgroundImage: 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1200&h=400&fit=crop' });
      app.appendChild(hero.render());

      const mainContainer = document.createElement('div');
      mainContainer.className = 'max-w-7xl mx-auto px-5 py-10';

      // SearchBar
      const searchBar = new SearchBar({ placeholder: 'Buscar por marca, modelo o año' });
      mainContainer.appendChild(searchBar.render());
      searchBar.element.addEventListener('search', (e) => {
        console.log('Busqueda:', e.detail.query);
        // comportamiento demo: filtrar por título y mostrar un alert con resultados
        const q = (e.detail.query || '').toLowerCase();
        if (!q) return;
        const found = testVehicles.filter(v => (v.title || '').toLowerCase().includes(q));
        alert(`Resultados encontrados: ${found.length}`);
      });

      const categoryFilters = new CategoryFilters({ categories: testCategories, activeCategory: 'all', onChange: (categoryId) => console.log('Categoria:', categoryId) });
      mainContainer.appendChild(categoryFilters.render());

      // Carrusel: Más vistos (demo)
      const carouselSection = document.createElement('section');
      carouselSection.className = 'my-6';
      const cTitle = document.createElement('h3');
      cTitle.className = 'text-xl font-bold mb-3';
      cTitle.textContent = 'Más vistos (Carousel)';
      carouselSection.appendChild(cTitle);
      const carousel = new VehicleCarousel({ items: testVehicles.slice(0, 6) });
      carouselSection.appendChild(carousel.render());
      mainContainer.appendChild(carouselSection);

      const vehiclesGrid = document.createElement('div');
      vehiclesGrid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 my-8';

      testVehicles.forEach(vehicle => {
        const card = new VehicleCard({ ...vehicle, onClick: (v) => alert(`Seleccionaste: ${v.title}`) });
        vehiclesGrid.appendChild(card.render());
      });

      mainContainer.appendChild(vehiclesGrid);

      // Contact form demo
      const contactSection = document.createElement('section');
      contactSection.className = 'my-8';
      const contactTitle = document.createElement('h3');
      contactTitle.className = 'text-xl font-bold mb-3';
      contactTitle.textContent = 'Contactanos';
      contactSection.appendChild(contactTitle);
      const contactForm = new ContactForm();
      contactForm.element.addEventListener('submit', (ev) => {
        console.log('Contacto enviado', ev.detail);
        alert('Mensaje enviado (demo)\n' + JSON.stringify(ev.detail, null, 2));
      });
      contactSection.appendChild(contactForm.render());
      mainContainer.appendChild(contactSection);
      app.appendChild(mainContainer);

      const footer = new Footer({ copyrightYear: 2024, copyrightText: 'TuAutoCom. Todos los derechos reservados.'});
      app.appendChild(footer.render());
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderApp); else renderApp();
  </script>
</body>
</html>
