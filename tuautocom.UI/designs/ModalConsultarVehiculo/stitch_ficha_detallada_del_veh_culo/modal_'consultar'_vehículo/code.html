<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div class="relative flex h-auto min-h-screen w-full flex-col bg-[#10231c] dark group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
      <div class="layout-container flex h-full grow flex-col">
        <div class="px-40 flex flex-1 justify-center py-5">
          <div class="layout-content-container flex flex-col w-[512px] max-w-[512px] py-5 max-w-[960px] flex-1">
            <div class="@container">
              <div class="@[480px]:px-4 @[480px]:py-3">
                <div
                  class="bg-cover bg-center flex flex-col justify-end overflow-hidden bg-[#10231c] @[480px]:rounded-lg min-h-[218px]"
                  style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0) 25%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuAlik3DAE-G8iBG51qsUqxytcWryeoHAcZ-W16ih37d8AizfGr1gqfgNNl-e8G0f30q--w5IfAQlU_EqJ9phT7XZBPVar9OmtGx4hu_bCIBMumWRAbVApdzPqdx1Vi-htOp7r3gNGelgNwSRiMLSOuMICzPCSQigW9My7E5KRtTxN3qSOU2_itIzx0H43mbvgWpYzOrwy_fUZ0mWT9hn75iK_hxKpV6lbYpTZwE9az4UFe0cHTc35BwDwgF_eqPvjBpsKS0eFo7RA");'
                >
                  <div class="flex justify-center gap-2 p-5">
                    <div class="size-1.5 rounded-full bg-[#10231c]"></div>
                    <div class="size-1.5 rounded-full bg-[#10231c] opacity-50"></div>
                    <div class="size-1.5 rounded-full bg-[#10231c] opacity-50"></div>
                    <div class="size-1.5 rounded-full bg-[#10231c] opacity-50"></div>
                    <div class="size-1.5 rounded-full bg-[#10231c] opacity-50"></div>
                  </div>
                </div>
              </div>
            </div>
            <h1 class="text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-3 pt-5">Vehicle Details</h1>
            <p class="text-white text-base font-normal leading-normal pb-3 pt-1 px-4">$35,000</p>
            <h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Specifications</h3>
            <div class="p-4 grid grid-cols-2">
              <div class="flex flex-col gap-1 border-t border-solid border-t-[#2f6a55] py-4 pr-2">
                <p class="text-[#8ecdb7] text-sm font-normal leading-normal">Make</p>
                <p class="text-white text-sm font-normal leading-normal">AutoDrive</p>
              </div>
              <div class="flex flex-col gap-1 border-t border-solid border-t-[#2f6a55] py-4 pl-2">
                <p class="text-[#8ecdb7] text-sm font-normal leading-normal">Model</p>
                <p class="text-white text-sm font-normal leading-normal">Model X</p>
              </div>
              <div class="flex flex-col gap-1 border-t border-solid border-t-[#2f6a55] py-4 pr-2">
                <p class="text-[#8ecdb7] text-sm font-normal leading-normal">Year</p>
                <p class="text-white text-sm font-normal leading-normal">2023</p>
              </div>
              <div class="flex flex-col gap-1 border-t border-solid border-t-[#2f6a55] py-4 pl-2">
                <p class="text-[#8ecdb7] text-sm font-normal leading-normal">Mileage</p>
                <p class="text-white text-sm font-normal leading-normal">15,000 miles</p>
              </div>
              <div class="flex flex-col gap-1 border-t border-solid border-t-[#2f6a55] py-4 pr-2">
                <p class="text-[#8ecdb7] text-sm font-normal leading-normal">Engine</p>
                <p class="text-white text-sm font-normal leading-normal">2.0L Turbo</p>
              </div>
              <div class="flex flex-col gap-1 border-t border-solid border-t-[#2f6a55] py-4 pl-2">
                <p class="text-[#8ecdb7] text-sm font-normal leading-normal">Transmission</p>
                <p class="text-white text-sm font-normal leading-normal">Automatic</p>
              </div>
            </div>
            <h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Contact Us</h3>
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Name</p>
                <input
                  placeholder="Your Name"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#2f6a55] bg-[#17352b] focus:border-[#2f6a55] h-14 placeholder:text-[#8ecdb7] p-[15px] text-base font-normal leading-normal"
                  value=""
                />
              </label>
            </div>
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Email</p>
                <input
                  placeholder="Your Email"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#2f6a55] bg-[#17352b] focus:border-[#2f6a55] h-14 placeholder:text-[#8ecdb7] p-[15px] text-base font-normal leading-normal"
                  value=""
                />
              </label>
            </div>
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Phone</p>
                <input
                  placeholder="Your Phone"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#2f6a55] bg-[#17352b] focus:border-[#2f6a55] h-14 placeholder:text-[#8ecdb7] p-[15px] text-base font-normal leading-normal"
                  value=""
                />
              </label>
            </div>
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <p class="text-white text-base font-medium leading-normal pb-2">Message</p>
                <textarea
                  placeholder="Your Message"
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border border-[#2f6a55] bg-[#17352b] focus:border-[#2f6a55] min-h-36 placeholder:text-[#8ecdb7] p-[15px] text-base font-normal leading-normal"
                ></textarea>
              </label>
            </div>
            <div class="flex justify-stretch">
              <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 justify-between">
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#019863] text-white text-sm font-bold leading-normal tracking-[0.015em]"
                >
                  <span class="truncate">Send</span>
                </button>
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#214a3c] text-white text-sm font-bold leading-normal tracking-[0.015em]"
                >
                  <span class="truncate">Close</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
